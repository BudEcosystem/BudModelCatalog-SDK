speechify:
  # A single metered rate rather than a per-model price: Speechify charges per character
  # across all voices, $10 per 1M on the entry plan ($8 Pro, $6 Scale are volume tiers, so
  # the entry rate is list). `text-to-speech` is a stand-in key following the label
  # Speechmatics' own table uses -- NOT a deployable model name.
  #
  # Its page also carries third-party estimates of competitors' rates, Cartesia at $49/1M
  # among them. The adapter anchors on the plan-overage phrasing so it cannot read those;
  # a test feeds the comparison table in and asserts nothing comes out.
  text-to-speech:
    mode: audio_speech
    input_cost_per_character: 0.00001
    billing:
      unit: character
      meter: input_characters
      currency: USD
      confidence: curated
      source:
        url: https://speechify.com/text-to-speech-api/
        checked_on: "2026-09-24"
        note: >-
          Published as $10 per 1M characters. Entry plan $10 per 1M characters; 10 / 1e6. Metered by character across all voices rather than per model. Higher plans are cheaper: $6, $8 per 1M.
