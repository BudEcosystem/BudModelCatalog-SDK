cartesia:
  # DERIVED, not curated: Cartesia sells credits, so there is no published per-unit price.
  # It does publish every conversion needed to compute one, which is the difference between
  # this and inventing a number:
  #   "1 credit equals 1 character"          (Sonic, text-to-speech)
  #   "3 credits equals 1 second of audio"   (Ink, speech-to-text)
  #   "At pro tier, it's $65 per 1M credits" (also: startup $45, scale $38)
  #
  # Pro is the entry paid tier and therefore the highest unit price -- list, by the same
  # rule applied to AWS tiers and to Speechmatics above. Startup and Scale are volume
  # discounts, not thresholds, so they are not modelled as `tiers`.
  #
  # `confidence: derived` is load-bearing. The arithmetic is an assumption about how
  # Cartesia converts credits, and it breaks the moment they reprice a tier without
  # repricing credits. A consumer should show it and not invoice from it unsupervised.
  sonic:
    mode: audio_speech
    input_cost_per_character: 0.000065
    billing:
      unit: character
      meter: input_characters
      currency: USD
      confidence: derived
      source:
        url: https://cartesia.ai/pricing
        checked_on: "2026-09-23"
        note: >-
          1 credit per character x $65 per 1M credits (pro tier) = 6.5e-05/char. Startup
          ($45/1M) and Scale ($38/1M) give 4.5e-05 and 3.8e-05.
  ink:
    mode: audio_transcription
    input_cost_per_second: 0.000195
    billing:
      unit: second
      meter: input_audio_seconds
      currency: USD
      confidence: derived
      source:
        url: https://cartesia.ai/pricing
        checked_on: "2026-09-23"
        note: >-
          3 credits per second x $65 per 1M credits (pro tier) = 1.95e-04/s. Cross-check:
          the page states Ink costs $0.39/hr on Scale; 3 x 3600 x $38/1M = $0.41/hr, a 5%
          gap, so the conversion is close but not exact -- hence `derived`.

google_speech:
  # Text-to-Speech only. Google quotes these per character directly, so there is no unit
  # conversion here and nothing to get wrong about it -- which made this the easiest vendor
  # of the set to add and the one most worth having: four capabilities, and no models in the
  # catalog before now.
  #
  # Scraped by scrapers/vendors/google_speech.py, so these refresh on their own. What is
  # written here is the floor used if that page stops parsing.
  #
  # Rates are what is charged AFTER the free allowance. Gemini TTS models are excluded: they
  # bill per million input text tokens and output audio tokens, a basis the catalog cannot
  # express. Speech-to-Text is a separate page and still absent -- see the note above.
  chirp-3-hd:
    mode: audio_speech
    input_cost_per_character: 0.00003
    billing:
      unit: character
      meter: input_characters
      currency: USD
      confidence: curated
